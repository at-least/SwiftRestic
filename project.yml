name: SwiftRestic
options:
  bundleIdPrefix: com.newlix
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    GCC_WARN_UNDECLARED_SELECTOR: YES
    CLANG_ENABLE_MODULES: YES

targets:
  SwiftRestic:
    type: application
    platform: macOS
    sources:
      - path: Sources/SwiftRestic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.newlix.SwiftRestic
        PRODUCT_NAME: SwiftRestic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/SwiftRestic.entitlements
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]

  SwiftResticTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SwiftResticTests
      - path: Sources/SwiftRestic/Core
      - path: Sources/SwiftRestic/Models
      - path: Sources/SwiftRestic/Services
      # The model layer only — the app entry point (and any view) stays out,
      # so the tests never pull in the UI. New AppModel domain files under
      # App/ are picked up automatically; add deliberate exceptions to
      # `excludes` below.
      - path: Sources/SwiftRestic/App
        excludes:
          - SwiftResticApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.newlix.SwiftResticTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SwiftRestic:
    build:
      targets:
        SwiftRestic: all
        SwiftResticTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SwiftResticTests
