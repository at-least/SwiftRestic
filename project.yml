name: SwiftRestic
options:
  bundleIdPrefix: com.newlix
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.11.1"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    GCC_WARN_UNDECLARED_SELECTOR: YES
    CLANG_ENABLE_MODULES: YES
  configs:
    # Debug uses the Apple Development certificate, not ad hoc: an ad-hoc
    # designated requirement is the build's cdhash, so each rebuild is a new
    # app to the Keychain and asks for the passwords again. Re-signing
    # Release (Developer ID) changes which Keychain items the app can read.
    Debug:
      CODE_SIGN_IDENTITY: "Apple Development: Mengyi Chen (VANHGVZ28R)"
      DEVELOPMENT_TEAM: 9683UUUF28

targets:
  SwiftRestic:
    type: application
    platform: macOS
    sources:
      - path: Sources/SwiftRestic
      - path: Support/Credits.rtf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.newlix.SwiftRestic
        PRODUCT_NAME: SwiftRestic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/SwiftRestic.entitlements
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
    postBuildScripts:
      - name: Embed helpers
        script: '"$SRCROOT/Tools/embed-helpers.sh"'
        basedOnDependencyAnalysis: false
    dependencies:
      - package: GRDB

  SwiftResticTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SwiftResticTests
      - path: Sources/SwiftRestic/Core
      - path: Sources/SwiftRestic/Models
      - path: Sources/SwiftRestic/Services
      # App/ without the entry point and the capture scaffolding that extends
      # its AppDelegate; Views/ stays out.
      - path: Sources/SwiftRestic/App
        excludes:
          - SwiftResticApp.swift
          - CaptureSupport.swift
    dependencies:
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.newlix.SwiftResticTests
        GENERATE_INFOPLIST_FILE: YES

  # Drives the real app's windows: run in a VM by Tools/ui-test.sh, not by
  # ./build.sh test on the host.
  SwiftResticUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/SwiftResticUITests
      - path: Sources/SwiftRestic/Views/AccessibilityID.swift
    dependencies:
      - target: SwiftRestic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.newlix.SwiftResticUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SwiftRestic

schemes:
  SwiftRestic:
    build:
      targets:
        SwiftRestic: all
        SwiftResticTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SwiftResticTests
  SwiftResticUITests:
    build:
      targets:
        SwiftRestic: all
        SwiftResticUITests: [test]
    test:
      config: Debug
      targets:
        - SwiftResticUITests
