name: CI

# Run by hand only (the owner's decision): `gh workflow run CI`.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (macOS)
    # macos-26 defaults to Xcode 26.6; macos-15's Xcode 16.4 SDK does not
    # mark UNNotificationSettings Sendable, which Swift 6 strict concurrency
    # rejects in AppModel+Notifications.
    runs-on: macos-26
    env:
      # The runner has no Apple Development certificate.
      SWIFTRESTIC_ADHOC_SIGN: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Run the suite
        run: ./build.sh test
